<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gesture Slingshot — CV Angry Birds Style</title>

<!-- MediaPipe Hands & Camera Utils CDNs -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f8fafc;
    color: #0f172a;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    user-select: none;
  }
  canvas { display: block; }

  /* Hidden Video Element for CV processing */
  #webcam { display: none; }

  /* Live Camera Corner Preview */
  #cam-preview-container {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 160px;
    height: 120px;
    border-radius: 12px;
    overflow: hidden;
    border: 2px solid #e2e8f0;
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    background: #000;
    z-index: 5;
  }
  #cam-preview {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
  }

  /* Status Bar */
  #cv-status {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #ffffff;
    border: 1px solid #e2e8f0;
    padding: 0.5rem 1.25rem;
    border-radius: 9999px;
    font-size: 0.85rem;
    font-weight: 600;
    color: #64748b;
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    display: flex;
    align-items: center;
    gap: 0.5rem;
    z-index: 5;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #94a3b8;
  }
  .status-dot.pulling { background: #dc2626; }
  .status-dot.ready { background: #16a34a; }

  /* Overlay Card */
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(248, 250, 252, 0.88);
    backdrop-filter: blur(8px);
    z-index: 10;
  }
  #overlay.hidden { display: none; }

  .card {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.05);
    border-radius: 24px;
    padding: 2.5rem;
    width: 100%;
    max-width: 420px;
    text-align: center;
  }

  .title {
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: #0f172a;
    margin-bottom: 0.35rem;
  }
  .sub {
    font-size: 0.9rem;
    color: #64748b;
    margin-bottom: 1.5rem;
    line-height: 1.5;
  }

  .btn {
    background: #0f172a;
    color: #ffffff;
    border: none;
    border-radius: 12px;
    padding: 0.875rem 2rem;
    font-size: 0.975rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
    width: 100%;
  }
  .btn:hover { background: #334155; }
  .btn:disabled { background: #94a3b8; cursor: not-allowed; }

  .rules {
    margin-top: 1.5rem;
    padding-top: 1.25rem;
    border-top: 1px solid #f1f5f9;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
    text-align: left;
  }
  .rule {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.8rem;
    font-weight: 500;
    color: #475569;
  }
</style>
</head>
<body>

<canvas id="c"></canvas>
<video id="webcam" playsinline></video>

<div id="cam-preview-container">
  <video id="cam-preview" autoplay playsinline muted></video>
</div>

<div id="cv-status">
  <div class="status-dot" id="statusDot"></div>
  <span id="statusText">Initializing Camera...</span>
</div>

<div id="overlay">
  <div class="card">
    <div class="title">Gesture Slingshot</div>
    <div class="sub">Control the slingshot with camera gestures:</div>
    <button class="btn" id="startBtn" disabled>Starting Camera...</button>
    <div class="rules">
      <div class="rule">✊ <b>FIST</b>: Hold & Pull Sling</div>
      <div class="rule">✋ <b>OPEN PALM</b>: Release & Shoot!</div>
    </div>
  </div>
</div>

<script>
// ─── Canvas & Setup ────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

let state = 'idle'; 
let score = 0;
let shotsLeft = 3;

// Game World Objects
const anchor = { x: 220, y: canvas.height - 220 };
const bird = { x: anchor.x, y: anchor.y, vx: 0, vy: 0, radius: 18, state: 'READY' }; 
// bird.state: 'READY' | 'PULLING' | 'FLYING' | 'RESETTING'

const MAX_PULL = 130;
const LAUNCH_POWER = 12.5;
const GRAVITY = 980; // px/s²

let handX = anchor.x, handY = anchor.y;
let isFist = false;
let isOpenPalm = false;
let wasFist = false; // To detect release transition

// Targets / Blocks Structure
let targets = [];

function initTargets() {
  targets = [];
  const startX = canvas.width - 280;
  const groundY = canvas.height - 100;

  // Build a tower of target boxes and green pigs
  const cols = 3;
  const rows = 4;
  const w = 40, h = 40;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      targets.push({
        x: startX + c * (w + 12),
        y: groundY - (r + 1) * (h + 8),
        w: w,
        h: h,
        vx: 0,
        vy: 0,
        type: (r % 2 === 0 && c === 1) ? 'PIG' : 'BLOCK',
        hp: 1,
        active: true
      });
    }
  }
}

// ─── Image Processing / MediaPipe Hands ──────────────────────────────
const videoElement = document.getElementById('webcam');
const previewElement = document.getElementById('cam-preview');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const startBtn = document.getElementById('startBtn');

let isCameraReady = false;

function processGestures(landmarks) {
  const wrist = landmarks[0];
  const mcpMiddle = landmarks[9];
  const palmSize = Math.hypot(mcpMiddle.x - wrist.x, mcpMiddle.y - wrist.y);

  const tips = [8, 12, 16, 20];
  let extendedFingers = 0;

  for (let tipIdx of tips) {
    const tip = landmarks[tipIdx];
    const distToWrist = Math.hypot(tip.x - wrist.x, tip.y - wrist.y);
    if (distToWrist > palmSize * 1.3) {
      extendedFingers++;
    }
  }

  isFist = (extendedFingers <= 1);
  isOpenPalm = (extendedFingers >= 3);
}

function onResults(results) {
  if (!isCameraReady) {
    isCameraReady = true;
    startBtn.disabled = false;
    startBtn.textContent = 'Start Game';
    statusDot.classList.add('ready');
    statusText.textContent = 'Ready — Show Hand in Camera';
  }

  if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
    const hand = results.multiHandLandmarks[0];
    processGestures(hand);

    const palm = hand[9];
    handX = (1 - palm.x) * canvas.width;
    handY = palm.y * canvas.height;

    if (isFist) {
      statusDot.className = 'status-dot pulling';
      statusText.textContent = '✊ FIST: Holding / Aiming Slingshot';
    } else if (isOpenPalm) {
      statusDot.className = 'status-dot ready';
      statusText.textContent = '✋ OPEN PALM: Released / Ready';
    }
  } else {
    isFist = false;
    isOpenPalm = false;
    statusDot.className = 'status-dot';
    statusText.textContent = 'No Hand Detected';
  }
}

// MediaPipe Setup
const hands = new Hands({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});
hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.6 });
hands.onResults(onResults);

const camera = new Camera(videoElement, {
  onFrame: async () => { await hands.send({ image: videoElement }); },
  width: 640, height: 480
});

camera.start().then(() => {
  navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
    previewElement.srcObject = stream;
  });
}).catch(() => {
  statusText.textContent = 'Camera Off (Mouse Fallback Active)';
  startBtn.disabled = false;
  startBtn.textContent = 'Play with Mouse';
});

// Mouse Fallback
canvas.addEventListener('mousedown', () => { isFist = true; isOpenPalm = false; });
canvas.addEventListener('mouseup', () => { isFist = false; isOpenPalm = true; });
canvas.addEventListener('mousemove', e => {
  if (!isCameraReady) { handX = e.clientX; handY = e.clientY; }
});

// ─── Particles & FX ──────────────────────────────────────────────────
let particles = [];
function explode(x, y, color = '#16a34a') {
  for (let i = 0; i < 16; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 50 + Math.random() * 150;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      r: 3 + Math.random() * 3,
      life: 1,
      decay: 0.8 + Math.random() * 0.8,
      color
    });
  }
}

// ─── Game Loop ───────────────────────────────────────────────────────
let lastTime = 0;
let flightTrail = [];

function startGame() {
  score = 0;
  shotsLeft = 3;
  anchor.y = canvas.height - 180;
  resetBird();
  initTargets();
  state = 'playing';
  document.getElementById('overlay').classList.add('hidden');
  lastTime = performance.now();
  requestAnimationFrame(loop);
}

function resetBird() {
  bird.x = anchor.x;
  bird.y = anchor.y;
  bird.vx = 0;
  bird.vy = 0;
  bird.state = 'READY';
  flightTrail = [];
}

document.getElementById('startBtn').addEventListener('click', startGame);

function loop(ts) {
  if (state !== 'playing') return;

  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;

  // --- Slingshot Logic ---
  if (bird.state === 'READY' || bird.state === 'PULLING') {
    if (isFist) {
      bird.state = 'PULLING';
      // Pull calculation
      const dx = handX - anchor.x;
      const dy = handY - anchor.y;
      const dist = Math.hypot(dx, dy);

      if (dist > MAX_PULL) {
        bird.x = anchor.x + (dx / dist) * MAX_PULL;
        bird.y = anchor.y + (dy / dist) * MAX_PULL;
      } else {
        bird.x = handX;
        bird.y = handY;
      }
    } 
    // Release trigger: transition from Fist -> Open Palm / Release
    else if (wasFist && (isOpenPalm || !isFist) && bird.state === 'PULLING') {
      const pullX = anchor.x - bird.x;
      const pullY = anchor.y - bird.y;

      if (Math.hypot(pullX, pullY) > 15) {
        bird.vx = pullX * LAUNCH_POWER;
        bird.vy = pullY * LAUNCH_POWER;
        bird.state = 'FLYING';
        shotsLeft--;
      } else {
        resetBird();
      }
    }
  }
  wasFist = isFist;

  // --- Flight Physics ---
  if (bird.state === 'FLYING') {
    bird.vy += GRAVITY * dt;
    bird.x += bird.vx * dt;
    bird.y += bird.vy * dt;

    flightTrail.push({ x: bird.x, y: bird.y });

    // Check target collisions
    for (let t of targets) {
      if (!t.active) continue;

      if (bird.x + bird.radius > t.x && bird.x - bird.radius < t.x + t.w &&
          bird.y + bird.radius > t.y && bird.y - bird.radius < t.y + t.h) {
        
        t.active = false;
        explode(t.x + t.w/2, t.y + t.h/2, t.type === 'PIG' ? '#16a34a' : '#d97706');
        score += t.type === 'PIG' ? 200 : 50;
      }
    }

    // Ground / Wall hit
    if (bird.y >= canvas.height - 100 || bird.x > canvas.width + 50) {
      explode(bird.x, bird.y, '#dc2626');
      bird.state = 'RESETTING';
      setTimeout(() => {
        resetBird();
      }, 1000);
    }
  }

  // Update Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.life -= p.decay * dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // ── Render Minimal Clean Canvas ──
  ctx.fillStyle = '#f8fafc';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Draw Ground
  ctx.fillStyle = '#e2e8f0';
  ctx.fillRect(0, canvas.height - 100, canvas.width, 100);

  // Draw Targets
  for (let t of targets) {
    if (!t.active) continue;
    ctx.save();
    if (t.type === 'PIG') {
      ctx.fillStyle = '#16a34a';
      ctx.beginPath();
      ctx.arc(t.x + t.w/2, t.y + t.h/2, t.w/2, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = '#d97706';
      ctx.fillRect(t.x, t.y, t.w, t.h);
    }
    ctx.restore();
  }

  // Draw Flight Trajectory Trail
  for (let pt of flightTrail) {
    ctx.fillStyle = 'rgba(148, 163, 184, 0.4)';
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  // Draw Slingshot Bands
  if (bird.state === 'PULLING' || bird.state === 'READY') {
    ctx.save();
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(anchor.x - 15, anchor.y);
    ctx.lineTo(bird.x, bird.y);
    ctx.lineTo(anchor.x + 15, anchor.y);
    ctx.stroke();
    ctx.restore();
  }

  // Draw Slingshot Post
  ctx.fillStyle = '#475569';
  ctx.fillRect(anchor.x - 6, anchor.y, 12, canvas.height - 100 - anchor.y);

  // Draw Bird (Red Sphere)
  if (bird.state !== 'RESETTING') {
    ctx.save();
    ctx.fillStyle = '#dc2626';
    ctx.beginPath();
    ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Draw Particles
  for (let p of particles) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0.5, p.r * p.life), 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // HUD Text
  ctx.fillStyle = '#0f172a';
  ctx.font = '600 18px sans-serif';
  ctx.fillText(`Score: ${score}`, 30, 48);

  requestAnimationFrame(loop);
}
</script>
</body>
</html>
